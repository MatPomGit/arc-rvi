[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-rvi"
version = "1.15.0"
description = "Independent research tools for autonomous robotic visual inspection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rvi = "rvi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
