
name: Copilot Studio Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: copilot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trigger-review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Prepare review request
        env:
          PR_EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["PR_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          pr = event["pull_request"]
          payload = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "pr_number": pr["number"],
              "head_sha": pr["head"]["sha"],
              "run_id": os.environ["GITHUB_RUN_ID"]
          }

          with open("request.json", "w", encoding="utf-8") as f:
              json.dump(payload, f)
          PY

      - name: Invoke Copilot Studio
        env:
          COPILOT_FLOW_URL: ${{ secrets.COPILOT_FLOW_URL }}
        run: |
          test -n "$COPILOT_FLOW_URL"
          curl --fail --silent --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            -X POST \
            -H "Content-Type: application/json" \
            --data-binary @request.json \
            "$COPILOT_FLOW_URL"
