      - Study 02 - Localization: docs/localization.md
      - Commanded vehicle inspection mission: docs/vehicle-inspection-missions.md
      - Reflective bodywork image ROI audit: docs/vehicle-image-qa.md
      - Study 02 - Protocol: experiments/exp02_localization/protocol.md
      - Study 03 - Viewpoint planning: experiments/exp03_viewpoint_planning/protocol.md
      - Study 04 - Active coverage: experiments/exp04_active_coverage/protocol.md
      - Study 05 - Repeatability: experiments/exp05_repeatability/protocol.md
      - Study 06 - Quality control: experiments/exp06_quality_control/protocol.md
      - Study 07 - Transfer: experiments/exp07_transfer/protocol.md
      - Study 08 - Field evaluation: experiments/exp08_field_validation/protocol.md
      - Shared analysis: experiments/analysis/README.md
  - Software and models:
      - Architecture: docs/architecture.md
      - Paired benchmark: docs/benchmark.md
      - Immutable experiment batches: docs/experiment-batches.md
      - Geometric simulator: docs/simulation.md
      - Seeded conditions: docs/conditions.md
      - Paired pilot analysis: docs/pilot-analysis.md
      - Sampled geometry population: docs/population.md
      - Sample-size sensitivity: docs/sample-size.md
      - Cluster Monte Carlo: docs/cluster-monte-carlo.md
      - Data interface: docs/data-interface.md
  - Research integrity:
      - Literature evidence and publication gates: docs/literature.md
      - Critical prior-art appraisal: docs/prior-art-critical.md
      - Methodology: docs/methodology.md
      - Reproducibility: docs/reproducibility.md
      - Safety: docs/safety.md
  - Project:
